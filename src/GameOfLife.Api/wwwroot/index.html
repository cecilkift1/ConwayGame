<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conway — Game of Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2e28;
      --ink-soft: #3d5a50;
      --mist: #e8f0ec;
      --fog: #c5d9d0;
      --leaf: #1f7a5c;
      --leaf-bright: #2ea878;
      --glow: #7dffc4;
      --sand: #f3ebe0;
      --warn: #c45c3e;
      --surface: rgba(255, 255, 255, 0.42);
      --line: rgba(26, 46, 40, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 12% -10%, rgba(126, 220, 180, 0.45), transparent 55%),
        radial-gradient(900px 600px at 88% 8%, rgba(180, 210, 200, 0.55), transparent 50%),
        radial-gradient(800px 500px at 50% 110%, rgba(243, 235, 224, 0.9), transparent 45%),
        linear-gradient(165deg, #dcebe4 0%, #eef4f0 42%, #e4ece7 100%);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(26, 46, 40, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 46, 40, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 40%, black 30%, transparent 75%);
      animation: drift 28s linear infinite;
    }

    @keyframes drift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 48px 48px, 48px 48px; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-play {
      0%, 100% { box-shadow: 0 0 0 0 rgba(46, 168, 120, 0.35); }
      50% { box-shadow: 0 0 0 10px rgba(46, 168, 120, 0); }
    }

    .stage {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 0;
      padding: clamp(20px, 4vw, 40px);
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .brand {
      animation: rise 0.7s ease-out both;
      text-align: center;
      padding-bottom: clamp(12px, 2vh, 24px);
    }

    .brand h1 {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: clamp(3rem, 9vw, 5.5rem);
      letter-spacing: -0.04em;
      line-height: 0.92;
      color: var(--ink);
    }

    .brand h1 span {
      display: block;
      font-size: 0.28em;
      letter-spacing: 0.28em;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--leaf);
      margin-top: 0.55em;
    }

    .brand p {
      margin-top: 0.85rem;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      color: var(--ink-soft);
      max-width: 34ch;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.45;
      animation: rise 0.8s ease-out 0.1s both;
    }

    .board-plane {
      position: relative;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: rise 0.9s ease-out 0.15s both;
    }

    canvas#life {
      width: min(92vw, 72vh, 720px);
      height: min(92vw, 72vh, 720px);
      max-height: 100%;
      border-radius: 4px;
      cursor: crosshair;
      touch-action: none;
      background:
        linear-gradient(160deg, rgba(255,255,255,0.55), rgba(245,250,247,0.35));
      box-shadow:
        0 1px 0 rgba(255,255,255,0.7) inset,
        0 24px 60px rgba(26, 46, 40, 0.12);
    }

    .meta {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.25rem;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
      pointer-events: none;
    }

    .meta strong {
      color: var(--leaf);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.55rem 0.65rem;
      padding-top: clamp(16px, 3vh, 28px);
      animation: rise 0.8s ease-out 0.25s both;
    }

    .controls button,
    .controls label.file-ish {
      font-family: "Outfit", sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--ink);
      background: transparent;
      border: 1.5px solid var(--ink);
      border-radius: 2px;
      padding: 0.65rem 1.1rem;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .controls button:hover:not(:disabled),
    .controls label.file-ish:hover {
      background: var(--ink);
      color: var(--mist);
      transform: translateY(-1px);
    }

    .controls button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .controls button.primary {
      background: var(--leaf);
      border-color: var(--leaf);
      color: #f4fff9;
    }

    .controls button.primary:hover:not(:disabled) {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--glow);
    }

    .controls button.playing {
      animation: pulse-play 1.4s ease-in-out infinite;
      background: var(--leaf-bright);
      border-color: var(--leaf-bright);
      color: #062216;
    }

    .status {
      width: 100%;
      text-align: center;
      font-size: 0.88rem;
      color: var(--ink-soft);
      min-height: 1.25rem;
      margin-top: 0.35rem;
    }

    .status.ok { color: var(--leaf); }
    .status.err { color: var(--warn); }

    .dim-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin: 0 0.4rem;
      font-size: 0.85rem;
      color: var(--ink-soft);
    }

    .dim-row input {
      width: 3.2rem;
      font-family: "Outfit", sans-serif;
      font-size: 0.9rem;
      text-align: center;
      border: 1.5px solid var(--line);
      background: var(--surface);
      border-radius: 2px;
      padding: 0.45rem 0.25rem;
      color: var(--ink);
    }

    .swagger {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 2;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    .swagger:hover {
      color: var(--leaf);
      border-color: var(--leaf);
    }

    @media (max-width: 640px) {
      .stage { padding: 16px 14px 20px; }
      .controls { gap: 0.4rem; }
      .controls button { padding: 0.55rem 0.85rem; font-size: 0.85rem; }
      .meta { display: none; }
    }
  </style>
</head>
<body>
  <a class="swagger" href="/swagger" target="_blank" rel="noopener">API ↗</a>

  <div class="stage">
    <header class="brand">
      <h1>Conway<span>Game of Life</span></h1>
      <p>Draw a pattern. Watch cells live, die, and form new worlds.</p>
    </header>

    <div class="board-plane">
      <div class="meta">
        <span>Gen <strong id="gen">0</strong></span>
        <span id="flag-stable" hidden>Stable</span>
        <span id="flag-empty" hidden>Empty</span>
      </div>
      <canvas id="life" width="640" height="640" aria-label="Game of Life board"></canvas>
    </div>

    <div>
      <div class="controls">
        <div class="dim-row">
          <label for="rows">Rows</label>
          <input id="rows" type="number" min="5" max="80" value="24" />
          <span>×</span>
          <label for="cols">Cols</label>
          <input id="cols" type="number" min="5" max="80" value="24" />
          <button type="button" id="resize">Apply</button>
        </div>
        <button type="button" id="random">Randomize</button>
        <button type="button" id="clear">Clear</button>
        <button type="button" id="upload" class="primary">Upload</button>
        <button type="button" id="step" disabled>Step</button>
        <button type="button" id="play" disabled>Play</button>
        <button type="button" id="reset" disabled>Reset</button>
        <button type="button" id="final" disabled>Final</button>
      </div>
      <p id="status" class="status">Paint cells, then Upload to sync with the API.</p>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const canvas = $("life");
    const ctx = canvas.getContext("2d");
    const statusEl = $("status");

    let rows = 24, cols = 24;
    let grid = [];
    let boardId = null;
    let generation = 0;
    let playTimer = null;
    let painting = false;
    let paintValue = true;
    let cellW = 1, cellH = 1;

    function clampDim(v) {
      v = parseInt(v, 10);
      if (isNaN(v)) v = 24;
      return Math.max(5, Math.min(80, v));
    }

    function makeGrid(r, c, fill) {
      const g = [];
      for (let i = 0; i < r; i++) {
        g[i] = [];
        for (let j = 0; j < c; j++) {
          if (typeof fill === "function") g[i][j] = fill(i, j);
          else if (fill === "preserve") g[i][j] = !!(grid[i] && grid[i][j]);
          else g[i][j] = false;
        }
      }
      return g;
    }

    function seedBlinker() {
      const midR = Math.floor(rows / 2);
      const midC = Math.floor(cols / 2);
      grid = makeGrid(rows, cols, false);
      grid[midR - 1][midC] = true;
      grid[midR][midC] = true;
      grid[midR + 1][midC] = true;
    }

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      cellW = w / cols;
      cellH = h / rows;

      ctx.clearRect(0, 0, w, h);

      const bg = ctx.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, "rgba(248, 252, 249, 0.9)");
      bg.addColorStop(1, "rgba(232, 242, 236, 0.95)");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = "rgba(26, 46, 40, 0.07)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= rows; i++) {
        const y = Math.round(i * cellH) + 0.5;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      for (let j = 0; j <= cols; j++) {
        const x = Math.round(j * cellW) + 0.5;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }

      const pad = Math.max(1, Math.min(cellW, cellH) * 0.12);
      for (let i = 0; i < rows; i++) {
        for (let j = 0; j < cols; j++) {
          if (!grid[i][j]) continue;
          const x = j * cellW + pad;
          const y = i * cellH + pad;
          const cw = cellW - pad * 2;
          const ch = cellH - pad * 2;
          const g = ctx.createRadialGradient(
            x + cw * 0.35, y + ch * 0.3, 0,
            x + cw * 0.5, y + ch * 0.5, Math.max(cw, ch) * 0.75
          );
          g.addColorStop(0, "#7dffc4");
          g.addColorStop(0.55, "#2ea878");
          g.addColorStop(1, "#1a5c45");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.roundRect(x, y, cw, ch, Math.min(4, cw * 0.2));
          ctx.fill();
        }
      }
    }

    function cellFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      const c = Math.floor(x / cellW);
      const r = Math.floor(y / cellH);
      if (r < 0 || c < 0 || r >= rows || c >= cols) return null;
      return { r, c };
    }

    canvas.addEventListener("pointerdown", (e) => {
      const cell = cellFromEvent(e);
      if (!cell) return;
      paintValue = !grid[cell.r][cell.c];
      painting = true;
      grid[cell.r][cell.c] = paintValue;
      invalidateUpload();
      draw();
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!painting) return;
      const cell = cellFromEvent(e);
      if (!cell) return;
      if (grid[cell.r][cell.c] !== paintValue) {
        grid[cell.r][cell.c] = paintValue;
        draw();
      }
    });
    window.addEventListener("pointerup", () => { painting = false; });

    function gridToRows() {
      return grid.map((row) => row.map((v) => (v ? "#" : ".")).join(""));
    }

    function rowsToGrid(apiRows) {
      rows = apiRows.length;
      cols = apiRows[0].length;
      $("rows").value = rows;
      $("cols").value = cols;
      grid = apiRows.map((line) => line.split("").map((ch) => ch === "#"));
      draw();
    }

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function setBadges(stable, empty) {
      $("flag-stable").hidden = !stable;
      $("flag-empty").hidden = !empty;
    }

    function setGen(n) {
      generation = n;
      $("gen").textContent = n;
    }

    function simControls(enabled) {
      ["step", "play", "reset", "final"].forEach((id) => {
        $(id).disabled = !enabled;
      });
    }

    function stopPlay() {
      if (playTimer) clearInterval(playTimer);
      playTimer = null;
      $("play").textContent = "Play";
      $("play").classList.remove("playing");
    }

    function invalidateUpload() {
      if (playTimer) stopPlay();
      boardId = null;
      setGen(0);
      simControls(false);
      setBadges(false, false);
    }

    $("resize").onclick = () => {
      rows = clampDim($("rows").value);
      cols = clampDim($("cols").value);
      $("rows").value = rows;
      $("cols").value = cols;
      grid = makeGrid(rows, cols, "preserve");
      invalidateUpload();
      draw();
      setStatus("Grid resized.");
    };

    $("clear").onclick = () => {
      grid = makeGrid(rows, cols, false);
      invalidateUpload();
      draw();
      setStatus("Cleared.");
    };

    $("random").onclick = () => {
      grid = makeGrid(rows, cols, () => Math.random() < 0.28);
      invalidateUpload();
      draw();
      setStatus("Randomized.");
    };

    async function api(path, opts) {
      const res = await fetch(path, opts);
      let body = null;
      try { body = await res.json(); } catch {}
      if (!res.ok) {
        const msg = body && body.error ? body.error : `HTTP ${res.status}`;
        throw new Error(msg);
      }
      return body;
    }

    $("upload").onclick = async () => {
      try {
        setStatus("Uploading…");
        const data = await api("/api/boards", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rows: gridToRows() })
        });
        boardId = data.id;
        setGen(0);
        simControls(true);
        setBadges(false, false);
        setStatus("Uploaded. Step, Play, or seek Final.", "ok");
      } catch (e) {
        invalidateUpload();
        setStatus("Upload failed: " + e.message, "err");
      }
    };

    async function showGeneration(n) {
      const data = await api(`/api/boards/${boardId}/states/${n}`);
      rowsToGrid(data.rows);
      setGen(n);
      setBadges(data.isStable, data.isEmpty);
      return data;
    }

    $("step").onclick = async () => {
      if (!boardId) return;
      try {
        await showGeneration(generation + 1);
        setStatus(`Generation ${generation}.`);
      } catch (e) {
        setStatus("Step failed: " + e.message, "err");
      }
    };

    $("play").onclick = () => {
      if (!boardId) return;
      if (playTimer) { stopPlay(); return; }
      $("play").textContent = "Pause";
      $("play").classList.add("playing");
      playTimer = setInterval(async () => {
        try {
          const data = await showGeneration(generation + 1);
          if (data.isStable || data.isEmpty) {
            stopPlay();
            setStatus(
              data.isEmpty ? "Died out." : "Reached a stable form.",
              "ok"
            );
          }
        } catch (e) {
          stopPlay();
          setStatus("Play stopped: " + e.message, "err");
        }
      }, 220);
    };

    $("reset").onclick = async () => {
      if (!boardId) return;
      if (playTimer) stopPlay();
      try {
        await showGeneration(0);
        setStatus("Reset to generation 0.");
      } catch (e) {
        setStatus("Reset failed: " + e.message, "err");
      }
    };

    $("final").onclick = async () => {
      if (!boardId) return;
      if (playTimer) stopPlay();
      try {
        setStatus("Seeking final state…");
        const data = await api(`/api/boards/${boardId}/final?maxAttempts=1000`);
        rowsToGrid(data.rows);
        setGen(data.attempts);
        setBadges(data.isStable, data.isEmpty);
        const kind = data.isEmpty ? "died out" : "stabilized";
        setStatus(`Final: ${kind} after ${data.attempts} generation(s).`, "ok");
      } catch (e) {
        setStatus(e.message, "err");
      }
    };

    seedBlinker();
    draw();
  </script>
</body>
</html>
