<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conway's Game of Life — UI + API</title>
  <style>
    :root {
      --bg: #0f172a;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 650; }
    header span { color: var(--muted); }
    header a { color: var(--accent); text-decoration: none; }
    header a:hover { text-decoration: underline; }
    .panes {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr);
      min-height: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    .panes iframe:first-child { border-right: 1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <h1>Conway's Game of Life</h1>
    <span>Board editor and Swagger API</span>
    <a href="/" target="_blank">UI only</a>
    <a href="/swagger" target="_blank">API only</a>
  </header>
  <div class="panes">
    <iframe src="/index.html" title="Board editor"></iframe>
    <iframe src="/swagger" title="Swagger API"></iframe>
  </div>
</body>
</html>
